version: '3.8'

# To build with a custom API endpoint (e.g. local backend reachable from the
# browser, not the container), set it in your shell before running compose:
#   VITE_API_BASE_URL=http://localhost:8080/api/v1 docker compose up --build
#
# The value is baked into the JS bundle at build time because Vite resolves
# import.meta.env.VITE_* statically — it cannot be changed at runtime.

services:
  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-Confiance Financial Platform}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
        VITE_ENABLE_LOGS: ${VITE_ENABLE_LOGS:-false}
    image: confiance-frontend:latest
    container_name: confiance-frontend
    ports:
      - "3000:80"
    # Lets the browser on the host talk to backend services running on the
    # host (api-gateway on :8080) while the frontend container itself can
    # still reach `host.docker.internal` if ever proxied server-side.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - confiance-network

networks:
  confiance-network:
    driver: bridge

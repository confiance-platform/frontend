# CSP is emitted in Report-Only mode so violations are logged by the browser
# console but do NOT block resource loads. Once the app is quiet in devtools
# for a while, you can flip `Content-Security-Policy-Report-Only` to
# `Content-Security-Policy` in the two locations below to enforce it.
map $sent_http_content_type $csp_policy {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' http://localhost:8080 https: ws: wss:; frame-src 'self' https:; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml font/woff2;

    # --- Baseline security headers (non-breaking) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy-Report-Only $csp_policy always;

    # Long-lived immutable hashed Vite assets (content-hashed filenames).
    # NOTE: nested add_header blocks replace ALL inherited add_header directives,
    # so we repeat the security headers inside every location that uses add_header.
    location ~* "^/assets/.*-[A-Za-z0-9_-]{6,}\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$" {
        expires 1y;
        access_log off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only $csp_policy always;
        add_header Cache-Control "public, immutable" always;
    }

    # Other static files (including the pre-built /assets/* copied from public/,
    # which have stable filenames and therefore should NOT be cached immutably).
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|css|js)$ {
        expires 1d;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only $csp_policy always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SPA routing: any unmatched URL serves index.html so React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy-Report-Only $csp_policy always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
